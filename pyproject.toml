[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp-system"
version = "0.1.0"
description = "A complete, defensive Data Leakage Prevention (DLP) system"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Security Engineering Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
    "flask-migrate>=4.0.5",
    "flask-wtf>=1.2.0",
    "wtforms>=3.1.0",
    "email-validator>=2.0.0",
    "argon2-cffi>=23.1.0",
    "flask-limiter>=3.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "S"]
ignore = ["S101", "E501", "B008"]  # Allow assert in tests, ignore line length, allow FastAPI/Pydantic default args
