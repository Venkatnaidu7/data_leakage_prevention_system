{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card">
    <h1 style="font-size: 3rem; color: #60a5fa; margin-bottom: 0.5rem;">404</h1>
    <h2 style="font-size: 1.25rem; color: #fff; margin-bottom: 0.75rem;">Page Not Found</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
      The requested route or object identifier does not exist.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
