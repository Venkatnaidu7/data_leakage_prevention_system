{% extends "base.html" %}
{% block title %}Payload Too Large{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card">
    <h1 style="font-size: 3rem; color: #fb923c; margin-bottom: 0.5rem;">413</h1>
    <h2 style="font-size: 1.25rem; color: #fff; margin-bottom: 0.75rem;">Payload Exceeds Limit</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
      The submitted file or request payload exceeds the configured maximum allowable limit (10MB).
    </p>
    <a href="{{ url_for('scanning.upload') }}" class="btn btn-primary">Try Smaller File</a>
  </div>
</div>
{% endblock %}
