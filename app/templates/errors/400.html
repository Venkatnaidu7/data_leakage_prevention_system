{% extends "base.html" %}
{% block title %}400 Bad Request{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card">
    <h1 style="font-size: 3rem; color: #fb923c; margin-bottom: 0.5rem;">400</h1>
    <h2 style="font-size: 1.25rem; color: #fff; margin-bottom: 0.75rem;">Bad Request</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
      The request could not be processed due to invalid parameters or formatting.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
