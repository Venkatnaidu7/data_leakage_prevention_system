{% extends "base.html" %}
{% block title %}500 Server Error{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card">
    <h1 style="font-size: 3rem; color: #f87171; margin-bottom: 0.5rem;">500</h1>
    <h2 style="font-size: 1.25rem; color: #fff; margin-bottom: 0.75rem;">Internal Server Error</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
      An unexpected internal condition occurred. Detailed error diagnostics have been safely recorded without leaking sensitive payload data.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
